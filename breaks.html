<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель перерывов</title>
    <!-- Подключаем наш общий премиальный стиль -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ / ПРОВЕРКИ СЕССИИ -->
<div id="auth-loader" class="modal-overlay open" style="z-index: 9999; background: var(--bg-main);">
    <div style="text-align: center; padding: 30px 0;">
        <div style="font-size: 32px; margin-bottom: 16px; animation: pulse 1.5s infinite;">⏳</div>
        <h3 style="color: var(--text-main);">Проверка доступа...</h3>
    </div>
</div>

<!-- ОКНО ВЫБОРА КАНАЛА -->
<div id="channel-screen" class="hide">
    <div class="mac-channel-card">
        <div class="mac-channel-title">Выберите канал связи</div>
        
        <button class="btn-mac-channel ch-hl" onclick="selectChannel('HL')">
            <span>📞</span> Горячая линия
        </button>
        <button class="btn-mac-channel ch-live" onclick="selectChannel('LIVE')">
            <span>💬</span> Чат LIVETEX
        </button>
        <button class="btn-mac-channel ch-night" onclick="selectChannel('NIGHT')">
            <span>🌙</span> Чат LIVETEX Ночь
        </button>
        
        <button id="btn-back-to-id" class="btn-mac-channel hide" style="margin-top: 20px; border: 1px dashed rgba(255,255,255,0.2); background: transparent;" onclick="window.location.href='index.html'">
            <span>🏠</span> ИД 2.0
        </button>

        <!-- 🆕 КНОПКА ДЛЯ АДМИНА -->
        <button id="btn-admin-panel" class="btn-mac-channel hide" style="margin-top: 10px; background: rgba(255, 95, 86, 0.1); border-color: rgba(255, 95, 86, 0.3); color: #ff5f56;" onclick="openAdminPanel()">
            <span>👑</span> Панель Администратора
        </button>
    </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ ПЕРЕРЫВОВ (Без внешнего скролла) -->
<div id="breaks-app" class="hide app-fullscreen-wrapper">
    
    <!-- Навигационная панель -->
    <div class="mac-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-weight: 800; color: var(--primary); letter-spacing: 1px; font-size: 18px;">LETU BREAKS</div>
            <div style="color: var(--text-muted); font-size: 14px; border-left: 2px solid var(--border-color); padding-left: 15px;">
                ID: <span id="op-id-display" style="color: var(--text-main); font-weight: 700;"></span>
            </div>
        </div>
        
        <div id="op-channel-display" class="channel-display-title"></div>
        
        <div class="header-actions-group">
                    <!-- 🆕 Новая кнопка массовой очистки -->
                    <button class="btn-clear-all" onclick="clearAllBookings()" title="Очистить неиспользованные брони">🗑️ Очистить всё</button>
                    
                    <button class="btn-back-channel" onclick="goToChannelSelection()" title="Сменить канал">◀️ Сменить канал</button>
                    <button id="theme-btn" class="btn-theme-toggle" onclick="toggleTheme()">☀️</button>
                    <button class="btn-mac-logout" onclick="logout()">🚪 ВЫЙТИ</button>
        </div>
    </div>

    <!-- Область оператора (Занимает всё оставшееся место) -->
    <div id="op-dashboard" class="hide dashboard-flex-area">
        
        <!-- Выбранные мной слоты -->
        <div id="my-booked-tags" class="tags-wrapper">
            <!-- Теги появятся здесь -->
        </div>

    <!-- Сетка слотов -->
    <div id="dynamic-slots-grid" class="slots-grid"></div>

        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="breaks.js"></script>
<!-- ФУЛЛСКРИН ТАЙМЕР ПЕРЕРЫВА -->
<div id="fullscreen-timer-overlay" class="hide fullscreen-timer-wrapper">
    <div class="timer-content">
        <div class="timer-title">ПЕРЕРЫВ</div>
        <div id="big-timer-time" class="timer-time">00:00</div>
        <div id="big-timer-slot" class="timer-slot">00:00-00:00</div>
        
        <!-- 🆕 Кнопка досрочного завершения -->
        <button id="btn-end-timer-early" class="btn-end-early">⏹ Завершить досрочно</button>
    </div>
</div>
<!-- 👑 ПАНЕЛЬ АДМИНИСТРАТОРА -->
<div id="admin-app" class="hide app-fullscreen-wrapper">
    <div class="mac-header">
        <div class="admin-header-left">
            <div class="admin-logo">LETU ADMIN</div>
        </div>
        
        <div class="channel-display-title" style="color: #ff5f56;">МОНИТОРИНГ</div>
        
        <div class="header-actions-group">
            <button id="admin-theme-btn" class="btn-theme-toggle" onclick="toggleTheme()">☀️</button>
            <button class="btn-back-channel" onclick="closeAdminPanel()">◀️ В меню</button>
            <button class="btn-mac-logout" onclick="logout()">🚪 ВЫЙТИ</button>
        </div>
    </div>

    <div class="dashboard-flex-area" style="padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%;">
        
        <!-- Верхняя панель управления -->
        <div class="admin-controls-card">
            <div class="admin-tabs">
                <button id="adm-tab-HL" class="admin-tab active" onclick="loadAdminMonitor('HL')">📞 ЛИНИЯ</button>
                <button id="adm-tab-LIVE" class="admin-tab" onclick="loadAdminMonitor('LIVE')">💬 ЧАТ</button>
                <button id="adm-tab-NIGHT" class="admin-tab" onclick="loadAdminMonitor('NIGHT')">🌙 НОЧЬ</button>
            </div>
            <div class="admin-actions">
                <button class="btn-admin-action" onclick="openIntervalEditorModal()">Редактор интервалов</button>
                <button class="btn-admin-action" onclick="openAccountsModal()">Аккаунты</button>
                <button class="btn-admin-action" style="color: #ff5f56; border-color: rgba(255,95,86,0.3);">Глобальный сброс</button>
            </div>
        </div>

        <!-- Доска мониторинга -->
        <div class="admin-monitor-board">
            <div class="monitor-header">
                <div class="col-op">Оператор</div>
                <div class="col-slots">Забронированные интервалы</div>
            </div>
            <div id="admin-monitor-list">
                <!-- Строки операторов появятся здесь -->
            </div>
        </div>

    </div>
</div>
<!-- ⚙️ МОДАЛКА РЕДАКТОРА ИНТЕРВАЛОВ -->
<div id="modal-interval-editor" class="modal-overlay" onclick="closeIntervalEditor(event)">
    <div class="modal-content" style="max-width: 550px; max-height: 85vh; display: flex; flex-direction: column;" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeIntervalEditor(null)">×</button>
        <h3 class="input-label" style="font-size: 18px; margin-bottom: 15px; color: var(--text-title);">⚙️ Редактор интервалов</h3>

        <!-- Переключатель каналов внутри модалки -->
        <div class="admin-tabs" style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
            <button id="ie-tab-HL" class="admin-tab active" onclick="loadIntervalEditor('HL')">📞 ЛИНИЯ</button>
            <button id="ie-tab-LIVE" class="admin-tab" onclick="loadIntervalEditor('LIVE')">💬 ЧАТ</button>
            <button id="ie-tab-NIGHT" class="admin-tab" onclick="loadIntervalEditor('NIGHT')">🌙 НОЧЬ</button>
        </div>

        <!-- Контейнер для списков (скроллируемый) -->
        <div id="ie-lists-container" style="overflow-y: auto; flex: 1; margin-bottom: 20px; padding-right: 10px;">
            <!-- Списки будут генерироваться скриптом -->
        </div>

        <!-- Форма добавления нового интервала -->
        <div style="background: var(--bg-hover); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color);">
            <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label class="small-label">Тип интервала</label>
                    <select id="ie-new-type" class="input-textarea single-line w-100" style="padding: 0 10px;"></select>
                </div>
                <div style="flex: 1;">
                    <label class="small-label">Время (Напр: 12:00-12:15)</label>
                    <input type="text" id="ie-new-time" class="input-textarea single-line w-100" style="padding: 0 10px;" placeholder="00:00-00:00">
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 12px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #a855f7;">
                    <input type="checkbox" id="ie-new-unique" style="width: 16px; height: 16px; accent-color: #a855f7;">
                    ✨ Уникальный интервал
                </label>
                <button onclick="addNewInterval()" class="btn-main btn-primary" style="padding: 8px 20px; flex: none;">➕ Добавить</button>
            </div>
        </div>
    </div>
</div>
<!-- 👥 МОДАЛКА УПРАВЛЕНИЯ АККАУНТАМИ -->
<div id="modal-accounts" class="modal-overlay" onclick="closeAccountsModal(event)">
    <div class="modal-content" style="max-width: 600px; max-height: 85vh; display: flex; flex-direction: column;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 class="input-label" style="font-size: 17px; margin: 0; color: var(--text-title);">👥 Управление доступом операторов</h3>
            <button class="modal-close" onclick="closeAccountsModal(null)">×</button>
        </div>

        <!-- Фильтры статусов -->
        <div class="admin-tabs" style="margin-bottom: 15px;">
            <button id="acc-tab-all" class="admin-tab active" onclick="setAccountsFilter('all')">Все</button>
            <button id="acc-tab-pending" class="admin-tab" onclick="setAccountsFilter('pending')">Ожидают подтверждения</button>
            <button id="acc-tab-confirmed" class="admin-tab" onclick="setAccountsFilter('confirmed')">Подтвержденные</button>
        </div>

        <!-- Список учетных записей -->
        <div id="accounts-list-container" style="overflow-y: auto; flex: 1; padding-right: 4px; min-height: 250px;">
            <!-- Строки пользователей генерируются JS -->
        </div>
    </div>
</div>
</body>
</html>
