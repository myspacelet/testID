<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель перерывов</title>
    <!-- Подключаем наш общий премиальный стиль -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ / ПРОВЕРКИ СЕССИИ -->
<div id="auth-loader" class="modal-overlay open" style="z-index: 9999; background: var(--bg-main);">
    <div style="text-align: center; padding: 30px 0;">
        <div style="font-size: 32px; margin-bottom: 16px; animation: pulse 1.5s infinite;">⏳</div>
        <h3 style="color: var(--text-main);">Проверка доступа...</h3>
    </div>
</div>

<!-- ОКНО ВЫБОРА КАНАЛА -->
<div id="channel-screen" class="hide">
    <div class="mac-channel-card">
        <div class="mac-channel-title">Выберите канал связи</div>
        
        <button class="btn-mac-channel ch-hl" onclick="selectChannel('HL')">
            <span>📞</span> Горячая линия
        </button>
        <button class="btn-mac-channel ch-live" onclick="selectChannel('LIVE')">
            <span>💬</span> Чат LIVETEX
        </button>
        <button class="btn-mac-channel ch-night" onclick="selectChannel('NIGHT')">
            <span>🌙</span> Чат LIVETEX Ночь
        </button>
        
        <button id="btn-back-to-id" class="btn-mac-channel hide" style="margin-top: 20px; border: 1px dashed rgba(255,255,255,0.2); background: transparent;" onclick="window.location.href='index.html'">
            <span>⬅️</span> Вернуться в ИД 2.0
        </button>
    </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ ПЕРЕРЫВОВ -->
<div id="breaks-app" class="hide">
    
    <!-- Навигационная панель -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); margin-bottom: 30px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-weight: bold; color: var(--primary); letter-spacing: 2px;">LETU BREAKS</div>
            <div style="color: var(--text-muted); font-size: 13px;">
                ID: <span id="op-id-display" style="color: var(--text-main); font-weight: bold;"></span>
            </div>
        </div>
        
        <div id="op-channel-display" style="font-weight: 600; color: #00aeef; font-size: 15px; letter-spacing: 1px;"></div>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-mac-channel" style="padding: 8px 15px; margin: 0; width: auto;" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>

    <!-- Область оператора -->
    <div id="op-dashboard" class="hide" style="padding: 0 20px;">
        
        <!-- Выбранные мной слоты -->
        <div id="my-booked-tags" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; min-height: 35px;">
            <!-- Теги появятся здесь -->
        </div>

        <!-- Сетка -->
        <div class="slots-grid">
            <div class="slots-col">
                <h3 class="slots-title">Перерывы (10 мин)</h3>
                <div style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:-15px; margin-bottom:15px;">Лимит: 4 шт.</div>
                <div id="breaks-10-container" class="slots-container"></div>
            </div>
            
            <div class="slots-col">
                <h3 class="slots-title">Обеды (30 мин)</h3>
                <div style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:-15px; margin-bottom:15px;">Лимит: 1 шт.</div>
                <div id="lunches-30-container" class="slots-container"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="breaks.js"></script>

</body>
</html>
